openapi: 3.0.3

info:
  title: Personal Finance API
  version: 1.0.0
  description: |
    A REST API for managing personal finances.
    It supports categories, financial transactions,
    transaction filtering, and financial reports.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: API health checks
  - name: Categories
    description: Category management
  - name: Transactions
    description: Financial transaction management
  - name: Reports
    description: Financial reports

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check API health
      description: Checks whether the API is responding.
      operationId: getHealth
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/categories:
    get:
      tags:
        - Categories
      summary: List all categories
      operationId: getCategories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Categories
      summary: Create a category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A category with the same name and type already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get a category by ID
      operationId: getCategoryById
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Categories
      summary: Update a category
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A category with the same name and type already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Categories
      summary: Delete a category
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Category deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category cannot be deleted because it is in use by transactions
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/transactions:
    get:
      tags:
        - Transactions
      summary: List financial transactions
      description: |
        Returns transactions with optional filters.
        Supported filters are type, categoryId, startDate, and endDate.
      operationId: getTransactions
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by transaction type
          schema:
            type: string
            enum:
              - income
              - expense
        - name: categoryId
          in: query
          required: false
          description: Filter by category ID
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: Include transactions on or after this date
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Include transactions on or before this date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Transactions
      summary: Create a financial transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get a transaction by ID
      operationId: getTransactionById
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Transactions
      summary: Update a financial transaction
      operationId: updateTransaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Transactions
      summary: Delete a financial transaction
      operationId: deleteTransaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Transaction deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reports/summary:
    get:
      tags:
        - Reports
      summary: Get a financial summary
      description: |
        Returns aggregated financial information for all transactions
        or for transactions within an optional date range.
      operationId: getFinancialSummary
      parameters:
        - name: startDate
          in: query
          required: false
          description: Include transactions on or after this date
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: endDate
          in: query
          required: false
          description: Include transactions on or before this date
          schema:
            type: string
            format: date
          example: "2026-10-31"
      responses:
        '200':
          description: Financial summary generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Unique resource identifier
      schema:
        type: string

  schemas:
    Category:
      type: object
      required:
        - id
        - name
        - type
        - createdAt
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Salary
        type:
          type: string
          enum:
            - income
            - expense
          example: income
        createdAt:
          type: string
          format: date-time
          example: "2026-10-27T12:00:00.000Z"

    CategoryInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          example: Salary
        type:
          type: string
          enum:
            - income
            - expense
          example: income

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: The requested resource was not found.
    Transaction:
      type: object
      required:
        - id
        - description
        - amount
        - type
        - categoryId
        - date
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "1"
        description:
          type: string
          example: Monthly salary
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 3500.00
        type:
          type: string
          enum:
            - income
            - expense
          example: income
        categoryId:
          type: string
          example: "1"
        date:
          type: string
          format: date
          example: "2026-10-27"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      properties:
        description:
          type: string
          example: Monthly salary
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 3500.00
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: string
          example: "1"
        date:
          type: string
          format: date
          example: "2026-10-27"

    TransactionUpdate:
      type: object
      description: Only the fields provided will be updated.
      minProperties: 1
      properties:
        description:
          type: string
          example: Updated transaction description
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 120.50
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: string
          example: "1"
        date:
          type: string
          format: date
          example: "2026-10-27"

  responses:
    BadRequest:
      description: Request contains invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'